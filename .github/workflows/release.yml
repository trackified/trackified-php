name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag matches TrackifiedClient::VERSION
        run: |
          version=$(grep -oP "VERSION = '\K[^']+" src/TrackifiedClient.php)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != VERSION $version"; exit 1; }
      - name: Build source archive
        run: |
          mkdir dist
          git archive --format=zip --prefix="trackified-php-${GITHUB_REF_NAME#v}/" -o "dist/trackified-php-${GITHUB_REF_NAME#v}.zip" "$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
